# Render Blueprint — KrishiSutra API (free plan, Singapore).
# Render reads this file when you choose "New → Blueprint" and pick this repository.
# The database is a free Neon PostgreSQL; paste its connection string when Render asks for DATABASE_URL.
# Guide: docs/deployment/06-deploy-render-neon.md
services:
  - type: web
    name: krishisutra-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    # Dev dependencies are needed to compile and to run migrations/seed (prisma, tsx, typescript).
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, starts the server at once and loads reference + published content in the
    # background (idempotent). See apps/api/scripts/start.sh.
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # you paste the Neon connection string during setup
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      # The Android app sends no Origin header and is not affected by CORS. This entry only allows
      # the Expo web preview during development; replace it with the real web app origin later.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:8081
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: DEVICE_REGISTRATIONS_PER_HOUR
        value: "20"
      # Phone sign-in (Part 3.2). Render generates random secrets. Phone sign-in stays disabled (503)
      # until an SMS provider exists — SMS_PROVIDER=none; device accounts keep working.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: none
