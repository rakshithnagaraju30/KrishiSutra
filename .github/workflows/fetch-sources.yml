name: Fetch content sources

# Content research helper: prints the text of public agricultural source pages to the log so
# crop content can be entered with exact citations (the development environment has no access to
# these sites). Run manually with a list of URLs. Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Source URLs (space or newline separated, max 25)'
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4 pypdf
      - name: Fetch and print sources
        env:
          URLS: ${{ inputs.urls }}
        run: python .github/scripts/fetch_sources.py "$URLS"
