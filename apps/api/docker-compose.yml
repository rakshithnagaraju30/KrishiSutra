# Local PostgreSQL 16 for KrishiSutra development (PostGIS image, so the optional geospatial
# extension is available later without changing the database).
#   docker compose up -d      → database on localhost:5432
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: krishisutra-postgres
    environment:
      POSTGRES_USER: krishisutra
      POSTGRES_PASSWORD: krishisutra_dev
      POSTGRES_DB: krishisutra
    ports:
      - "5432:5432"
    volumes:
      - krishisutra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishisutra -d krishisutra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  krishisutra-pgdata:
